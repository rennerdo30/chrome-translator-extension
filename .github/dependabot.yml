# Dependabot configuration.
#
# Low-traffic repository: every version update across all ecosystems lands in
# ONE pull request per month (a multi-ecosystem group). A cooldown skips
# releases younger than a week. Security updates are not delayed and arrive as
# soon as an advisory matches.
version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
    cooldown:
      default-days: 7
